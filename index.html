
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Code Art Portrait</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>MY CODE ART</h1>

  </main>

  <script src="script.js"></script>
</body>
</html>
